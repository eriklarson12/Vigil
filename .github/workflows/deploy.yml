# Build the image in ACR and roll it out to Azure Container Apps.
# Auth is OIDC (federated credential) — no long-lived Azure secrets in the repo.
# Required repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Required repo variables: ACR_NAME, ACA_APP, ACA_RG
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build in ACR
        run: |
          az acr build --registry ${{ vars.ACR_NAME }} \
            --image vigil:${{ github.sha }} --image vigil:latest .
      - name: Update Container App
        run: |
          az containerapp update \
            --name ${{ vars.ACA_APP }} --resource-group ${{ vars.ACA_RG }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/vigil:${{ github.sha }}
