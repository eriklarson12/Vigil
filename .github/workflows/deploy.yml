# Build the image on the runner, push to ACR, and roll it out to Azure Container Apps.
# Auth is OIDC (federated credential) — no long-lived Azure secrets in the repo.
# Required repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Required repo variables: ACR_NAME, ACA_APP, ACA_RG
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to ACR
        run: |
          ACR_TOKEN=$(az acr login --name ${{ vars.ACR_NAME }} --expose-token --output tsv --query accessToken)
          echo "$ACR_TOKEN" | docker login ${{ vars.ACR_NAME }}.azurecr.io \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin
      - name: Build and push image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ vars.ACR_NAME }}.azurecr.io/vigil:${{ github.sha }} \
            -t ${{ vars.ACR_NAME }}.azurecr.io/vigil:latest .
          docker push ${{ vars.ACR_NAME }}.azurecr.io/vigil:${{ github.sha }}
          docker push ${{ vars.ACR_NAME }}.azurecr.io/vigil:latest
      - name: Update Container App
        run: |
          az containerapp update \
            --name ${{ vars.ACA_APP }} --resource-group ${{ vars.ACA_RG }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/vigil:${{ github.sha }}
