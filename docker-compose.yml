services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    ports:
      - "5433:5432"   # 5433 to avoid clashing with a host Postgres
    volumes:
      - vigil-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vigil:vigil@db:5432/vigil
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    profiles: ["app"]   # `docker compose --profile app up` to run the app in Docker too;
                        # default local dev runs uvicorn on the host against the db container

volumes:
  vigil-pgdata:
